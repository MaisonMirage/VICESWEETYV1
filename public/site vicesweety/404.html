<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Vice Sweety</title>
  <meta name="theme-color" content="#1a0a2e" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FFFAF6;
      --hot-pink: #FF69B4;
      --turquoise: #40E0D0;
      --deep-purple: #1a0a2e;
      --display: 'Abril Fatface', serif;
      --sans: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--sans);
      background: var(--deep-purple);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(64,224,208,0.06) 0%, rgba(255,105,180,0.06) 100%);
      pointer-events: none;
    }
    .logo {
      width: 120px;
      margin-bottom: 2rem;
      filter: drop-shadow(0 0 18px rgba(249,144,232,0.35));
      position: relative;
    }
    .code {
      font-family: var(--display);
      font-size: clamp(5rem, 15vw, 10rem);
      line-height: 1;
      background: linear-gradient(135deg, var(--hot-pink) 0%, var(--turquoise) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 400;
      color: #fff;
      margin-bottom: 1rem;
      position: relative;
    }
    p {
      font-size: 1rem;
      color: rgba(255,255,255,0.5);
      font-weight: 300;
      max-width: 36ch;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      position: relative;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2.8rem;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--deep-purple);
      background: var(--turquoise);
      border: 2px solid var(--turquoise);
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .btn:hover {
      background: var(--hot-pink);
      color: #fff;
      border-color: var(--hot-pink);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(255,105,180,0.3);
    }
    .btn:focus-visible {
      outline: 2px solid var(--turquoise);
      outline-offset: 4px;
    }
    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--turquoise), var(--hot-pink));
      border-radius: 99px;
      margin: 0 auto 2rem;
      opacity: 0.6;
      position: relative;
    }
  </style>
</head>
<body>
  <a href="/"><img src="assets/Vice_Sweety_Logo.png" alt="Vice Sweety" class="logo" /></a>
  <div class="code">404</div>
  <div class="divider"></div>
  <h1>Ce dessert n'existe pas encore.</h1>
  <p>La page que tu cherches a peut-être été dévorée. Retourne à l'accueil pour découvrir nos créations.</p>
  <a href="/" class="btn">Retour à l'accueil →</a>
</body>
</html>
